name: Build Hacker APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip and Setup Structure
        run: |
          # 1. Setup settings.gradle cleanly
          echo "pluginManagement {" > settings.gradle
          echo "    repositories {" >> settings.gradle
          echo "        google()" >> settings.gradle
          echo "        mavenCentral()" >> settings.gradle
          echo "        gradlePluginPortal()" >> settings.gradle
          echo "    }" >> settings.gradle
          echo "}" >> settings.gradle
          echo "dependencyResolutionManagement {" >> settings.gradle
          echo "    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)" >> settings.gradle
          echo "    repositories {" >> settings.gradle
          echo "        google()" >> settings.gradle
          echo "        mavenCentral()" >> settings.gradle
          echo "    }" >> settings.gradle
          echo "}" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # 2. Enable AndroidX globally
          echo "android.useAndroidX=true" > gradle.properties
          
          # 3. Setup root build.gradle
          echo "plugins {" > build.gradle
          echo "    id 'com.android.application' version '8.2.0' apply false" >> build.gradle
          echo "    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false" >> build.gradle
          echo "}" >> build.gradle

          mkdir -p app
          
          # 4. Extract user's clean zip file
          unzip -o "smartagent.zip"
          
          # 5. Dynamically find directories safely using./ to prevent space-stripping bugs
          SRC_DIR=$(find./ -type d -name "src" | grep -v "app/src" | head -n 1)
          GRADLE_FILE=$(find./ -type f -name "build.gradle" | grep -v "^\./build.gradle$" | grep -v "app/" | head -n 1)
          
          # 6. Copy and inject configurations safely
          if test -d "$SRC_DIR"; then
            cp -r "$SRC_DIR" app/
            echo "Success: Entire src directory copied recursively!"
          else
            echo "ERROR: src directory not found in zip!"
            exit 1
          fi
          
          if test -f "$GRADLE_FILE"; then
            cp "$GRADLE_FILE" app/
            echo "Success: build.gradle copied!"
            
            # Safe linear injection for JVM compatibility
            echo "" >> app/build.gradle
            echo "android {" >> app/build.gradle
            echo "    compileOptions {" >> app/build.gradle
            echo "        sourceCompatibility JavaVersion.VERSION_17" >> app/build.gradle
            echo "        targetCompatibility JavaVersion.VERSION_17" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "    kotlinOptions {" >> app/build.gradle
            echo "        jvmTarget = '17'" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "}" >> app/build.gradle
            echo "Success: JVM target 17 injected cleanly!"
          else
            echo "ERROR: build.gradle not found in zip!"
            exit 1
          fi

      - name: Manual Gradle 8.4 Download
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$(pwd)/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Bake APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
