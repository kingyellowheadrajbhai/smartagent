name: Compile APK (The Magic)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # smartautomationagent.zip या जो भी ज़िप हो उसे अनज़िप करना
      - name: Unzip Uploaded Project
        run: |
          echo "गिटहब पर smartautomationagent.zip या app.zip फ़ाइल की खोज की जा रही..."
          if [ -f "smartautomationagent.zip" ]; then
            unzip -o smartautomationagent.zip
            if [ -d "smartautomationagent" ]; then
              cp -r smartautomationagent/*.
              rm -rf smartautomationagent
            fi
          elif [ -f "app.zip" ]; then
            unzip -o app.zip
          fi
          
          # KAPT K2 और AndroidX का सुरक्षा कवच
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kapt.use.k2=false" >> gradle.properties
          
          echo "अनज़िप के बाद फ़ाइल स्ट्रक्चर:"
          ls -la

      # 🚀 फिक्स: यहाँ हमने Java 21 का सेटअप किया है
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🚀 फिक्स: यहाँ हमने Gradle 8.6 का सेटअप किया है
      - name: Setup Gradle 8.6 for non-wrapper project
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # बिना रैपर के सीधे कंपाइल करना
      - name: Run Build and Assemble APK
        run: gradle :app:assembleDebug

      # अंत में उत्पन्न हुए APK को गिटहब आर्टिफैक्ट पर अपलोड करना
      - name: Upload APK for Raj Bhai
        uses: actions/upload-artifact@v4
        with:
          name: SmartAutomationAgent-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
