name: Build Hacker APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip and Setup Structure
        run: |
          # 1. Standard Android settings.gradle with Google repositories for plugins
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PRESERVE_EXISTING)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF
          
          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          mkdir -p app
          
          # 3. Extract user's clean zip file
          unzip -o "smartagent.zip"
          
          # 4. Dynamically find the standard src and build.gradle folders
          SRC_DIR=$(find . -type d -name "src" | grep -v "app/src" | head -n 1)
          GRADLE_FILE=$(find . -type f -name "build.gradle" | grep -v "^\./build.gradle$" | grep -v "app/" | head -n 1)
          
          # 5. Copy everything automatically into the app module
          if [ -d "$SRC_DIR" ]; then
            cp -r "$SRC_DIR" app/
            echo "Success: Entire src directory copied recursively!"
          else
            echo "ERROR: src directory not found in zip!"
            exit 1
          fi
          
          if [ -f "$GRADLE_FILE" ]; then
            cp "$GRADLE_FILE" app/
            echo "Success: build.gradle copied!"
          else
            echo "ERROR: build.gradle not found in zip!"
            exit 1
          fi

      - name: Manual Gradle 8.4 Download
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$(pwd)/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Bake APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
